name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 libgtk-3-dev xvfb ubuntu-drivers-common
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap environment
        run: make setup
      - name: Lint
        run: make lint
      - name: Test
        run: xvfb-run -a make test
