[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preen"
version = "0.4.0"
description = "Preen — system setup, deep cleaning and tuning for Linux"
authors = [{ name = "Preen contributors" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "psutil>=5.9; platform_system == 'Linux'",
]

[project.scripts]
preen = "preen_tool.app:main"
# Compatibility alias for 0.2.x users; drop in 0.4.
zorin-optimizer = "preen_tool.app:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=0.10"]

[tool.setuptools.packages.find]
# Discover every package so the shipped wheel/.deb always contains backend/.
include = ["preen_tool*"]
namespaces = false

[tool.setuptools.package-data]
preen_tool = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
